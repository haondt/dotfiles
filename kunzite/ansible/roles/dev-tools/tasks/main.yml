- name: Set role defaults
  set_fact:
    dev_tools: "{{ role_defaults | combine(dev_tools, recursive=True) }}"

- name: Set up Node.js
  when: dev_tools.nodejs.enabled
  include_role:
    name: nodejs

- name: Set up .NET
  when: dev_tools.dotnet.enabled
  include_role:
    name: dotnet

- name: Set up python
  when: dev_tools.python.enabled
  include_role:
    name: python

- name: Azure
  when: dev_tools.azure.enabled
  include_role:
    name: azure

- name: Set up Google Cloud
  when: dev_tools.gcloud.enabled
  include_role:
    name: gcloud

- name: Set up Terraform
  when: dev_tools.terraform.enabled
  include_role:
    name: terraform

- name: Install go
  when: dev_tools.go.enabled or dev_tools.databases.enabled or dev_tools.kind.enabled
  include_role:
    name: go

- name: Set up Kubernetes
  when: dev_tools.kubernetes.enabled or dev_tools.kind.enabled
  block:
    - name: Install k9s
      include_role:
        name: k9s
    - name: Install packages
      become: true
      package:
        name:
          - kubernetes-client
          - helm

- name: Set up database tools
  when: dev_tools.databases.enabled
  block:
    - name: Install packages
      become: true
      package:
        name:
          - postgresql
          - sqlitebrowser
    - name: Install lazysql via go install
      command: go install github.com/jorgerojas26/lazysql@latest
      args:
        creates: "{{ ansible_facts['user_dir'] }}/go/bin/lazysql"

- name: Set up chromium
  when: dev_tools.chromium.enabled
  become: true
  package:
    name: chromium

- name: Install docker
  when: dev_tools.docker.enabled or dev_tools.kind.enabled
  block:
    - name: Install docker
      include_role:
        name: docker

- name: Install KinD
  when: dev_tools.kind.enabled
  block:
    - name: Install kind via go install
      command: go install sigs.k8s.io/kind@v0.33.0
      args:
        creates: "{{ ansible_facts['user_dir'] }}/go/bin/kind"
