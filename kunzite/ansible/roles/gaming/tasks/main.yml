- name: Set role defaults
  set_fact:
    gaming: "{{ role_defaults | combine(gaming, recursive=True) }}"

- name: Set up rpmfusion/multimedia
  when: gaming.rpmfusion.enabled
  import_tasks: rpmfusion.yml

- name: Set up steam
  when: gaming.steam.enabled
  become: true
  ansible.builtin.package:
    name: steam
    state: present

- name: Set up OBS
  when: gaming.obs.enabled
  block:
    - name: Install obs dnf deps
      dnf:
        name:
          - xdg-desktop-portal
          - xdg-desktop-portal-wlr
        state: present
      become: true
    - name: Install OBS
      community.general.flatpak:
        name:
          - com.obsproject.Studio
        state: present
      become: true
